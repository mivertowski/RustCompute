[package]
name = "ringkernel-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "CUDA backend for RingKernel - NVIDIA GPU support via cudarc"
keywords = ["gpu", "actor", "cuda", "nvidia"]
categories = ["hardware-support"]
readme = "README.md"
build = "build.rs"

[dependencies]
ringkernel-core = { workspace = true }

# CUDA bindings - auto-detect CUDA version from build system
# The nvtx feature enables NVTX profiling integration
cudarc = { version = "0.19.3", optional = true, features = ["cuda-version-from-build-system", "nvtx"] }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Synchronization
parking_lot = { workspace = true }

# Serialization (for profiling chrome trace export)
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Cryptographic hashing (for PTX cache)
sha2 = { version = "0.10", optional = true }

# Temp directory (for cache tests)
tempfile = { workspace = true, optional = true }

# NVIDIA Management Library bindings (for NVLink topology detection).
# Optional — when disabled, topology probe falls back to cudarc's P2P detection.
nvml-wrapper = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }

# Note: GPU execution tests require the `cuda` feature to be enabled.
# Run with: cargo test -p ringkernel-cuda --features cuda

[features]
default = []
cuda = ["cudarc"]
# Cooperative groups support - requires nvcc at build time for PTX compilation
# Enables grid-wide synchronization via cuLaunchCooperativeKernel
cooperative = ["cuda"]
# GPU profiling support - NVTX integration, CUDA events, Chrome trace export
profiling = ["cuda", "serde", "serde_json"]
# PTX compilation cache - eliminates first-tick kernel compilation overhead
ptx-cache = ["cuda", "sha2", "tempfile"]
# Multi-GPU topology detection via NVML (NvlinkTopology::probe uses nvml-wrapper
# when enabled, otherwise falls back to cudarc P2P-only detection).
multi-gpu = ["cuda", "nvml-wrapper"]
# NVSHMEM symmetric-heap bindings (requires libnvshmem3-dev-cuda-12 or manual
# NVSHMEM install — see `multi_gpu::nvshmem` for bootstrap options).
# When enabled, a build-time linker search path is added; users whose
# NVSHMEM install lives outside /usr can set NVSHMEM_LIB_DIR.
nvshmem = ["cuda", "multi-gpu"]

# `cuda-1xxxx` feature names below are cudarc's own version features
# (propagated transitively via `cuda-version-from-build-system`), not
# declared here directly — silences rustc's `unexpected_cfgs` lint for
# `#[cfg(feature = "cuda-12040")]`-style checks against them in hopper/mod.rs.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("cuda-11040"))',
    'cfg(feature, values("cuda-11050"))',
    'cfg(feature, values("cuda-11060"))',
    'cfg(feature, values("cuda-11070"))',
    'cfg(feature, values("cuda-11080"))',
    'cfg(feature, values("cuda-12000"))',
    'cfg(feature, values("cuda-12010"))',
    'cfg(feature, values("cuda-12020"))',
    'cfg(feature, values("cuda-12030"))',
    'cfg(feature, values("cuda-12040"))',
    'cfg(feature, values("cuda-12050"))',
    'cfg(feature, values("cuda-12060"))',
    'cfg(feature, values("cuda-12080"))',
    'cfg(feature, values("cuda-12090"))',
    'cfg(feature, values("cuda-13000"))',
    'cfg(feature, values("cuda-13010"))',
    'cfg(feature, values("cuda-13020"))',
] }
